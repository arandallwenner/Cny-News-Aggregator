<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNY News Aggregator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           EASY CUSTOMIZING: change these colors and fonts
           ============================================================ */
        :root {
            --ink: #14213D;          /* deep navy: header, headlines */
            --sky: #E9EEF2;          /* page background, lake-effect grey-blue */
            --paper: #FFFFFF;        /* story cards */
            --signal: #F2C230;       /* broadcast-chyron yellow accent */
            --slate: #56657A;        /* secondary text */
            --rule: #CBD5DF;         /* borders */

            /* One color per news source (used on tabs, stripes, labels) */
            --src-syracuse: #1F6F78;
            --src-localsyr: #B8432F;
            --src-cnycentral: #5B4B8A;

            --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            --font-text: 'Source Serif 4', Georgia, serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-text);
            background: var(--sky);
            color: var(--ink);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ---------- Masthead ---------- */
        .masthead {
            background: var(--ink);
            color: #fff;
            padding: 36px 0 0;
        }

        .masthead-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            gap: 20px;
            flex-wrap: wrap;
        }

        h1 {
            font-family: var(--font-display);
            font-weight: 800;
            font-size: clamp(3rem, 8vw, 5.5rem);
            line-height: 0.88;
            letter-spacing: -0.01em;
        }

        h1 small {
            display: block;
            font-weight: 500;
            font-size: 0.34em;
            letter-spacing: 0.02em;
            color: #A9B6C8;
            margin-top: 10px;
        }

        .refresh-btn {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: 0.02em;
            background: var(--signal);
            color: var(--ink);
            border: none;
            padding: 12px 22px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border-radius: 3px;
        }

        .refresh-btn:hover { background: #FFD453; }
        .refresh-btn:disabled { opacity: 0.6; cursor: wait; }

        .refresh-btn svg { width: 18px; height: 18px; }
        .refresh-btn.spinning svg { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Chyron strip: the signature element */
        .chyron {
            margin-top: 28px;
            display: flex;
            align-items: stretch;
            font-family: var(--font-display);
            font-size: 1.15rem;
            font-weight: 600;
            overflow: hidden;
        }

        .chyron-tag {
            background: var(--signal);
            color: var(--ink);
            padding: 8px 16px;
            font-weight: 800;
            white-space: nowrap;
        }

        .chyron-text {
            background: #fff;
            color: var(--ink);
            padding: 8px 16px;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Controls ---------- */
        .controls {
            background: var(--paper);
            border-bottom: 1px solid var(--rule);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .controls-inner {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            padding-top: 12px;
            padding-bottom: 12px;
        }

        .tabs, .windows {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .tab, .win {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 1.1rem;
            background: transparent;
            color: var(--slate);
            border: 1px solid transparent;
            padding: 6px 14px;
            cursor: pointer;
            border-radius: 3px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .tab:hover, .win:hover { color: var(--ink); background: var(--sky); }

        .tab .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--c, var(--ink));
        }

        .tab .count {
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--slate);
            min-width: 1ch;
        }

        .tab.active {
            background: var(--c, var(--ink));
            color: #fff;
        }
        .tab.active .dot { background: #fff; }
        .tab.active .count { color: rgba(255,255,255,0.8); }

        .win.active {
            border-color: var(--ink);
            color: var(--ink);
        }

        .windows-label {
            font-family: var(--font-display);
            font-size: 1rem;
            color: var(--slate);
            align-self: center;
            margin-right: 4px;
        }

        button:focus-visible, a:focus-visible {
            outline: 3px solid var(--signal);
            outline-offset: 2px;
        }

        /* ---------- Stories ---------- */
        main.wrap { padding-top: 28px; padding-bottom: 56px; }

        .status {
            font-family: var(--font-display);
            font-size: 1.1rem;
            color: var(--slate);
            margin-bottom: 20px;
        }

        .notice {
            background: var(--paper);
            border-left: 5px solid var(--src-localsyr);
            padding: 18px 20px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .story {
            background: var(--paper);
            border-top: 5px solid var(--c);
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            transition: box-shadow 0.15s ease;
        }

        .story:hover { box-shadow: 0 6px 20px rgba(20, 33, 61, 0.14); }
        .story:hover .story-title { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }

        .story-img {
            aspect-ratio: 16 / 9;
            width: 100%;
            object-fit: cover;
            display: block;
            background: var(--sky);
        }

        .story-img.fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--c);
            color: rgba(255,255,255,0.9);
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 1.8rem;
            letter-spacing: 0.01em;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45), 0 0 18px rgba(0, 0, 0, 0.3);
        }

        .story-body {
            padding: 18px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .story-meta {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .story-source { color: var(--c); }
        .story-time { color: var(--slate); font-weight: 500; }

        .story-title {
            font-family: var(--font-text);
            font-weight: 700;
            font-size: 1.2rem;
            line-height: 1.3;
        }

        .story-desc {
            color: var(--slate);
            font-size: 0.98rem;
            line-height: 1.6;
        }

        /* Lead story: newest item spans the full row */
        .story.lead {
            grid-column: 1 / -1;
            display: grid;
            grid-template-columns: 1.35fr 1fr;
        }
        .story.lead .story-img { height: 100%; aspect-ratio: auto; min-height: 300px; }
        .story.lead .story-body { padding: 28px 32px; justify-content: center; gap: 14px; }
        .story.lead .story-title { font-size: clamp(1.6rem, 3vw, 2.3rem); line-height: 1.15; }
        .story.lead .story-desc { font-size: 1.08rem; }

        .empty {
            text-align: center;
            padding: 60px 20px;
            font-family: var(--font-display);
            font-size: 1.3rem;
            color: var(--slate);
        }

        .skeleton {
            background: var(--paper);
            height: 340px;
            border-top: 5px solid var(--rule);
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 50% { opacity: 0.55; } }

        footer {
            text-align: center;
            font-family: var(--font-display);
            color: var(--slate);
            padding-bottom: 40px;
            font-size: 1rem;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .story.lead { grid-template-columns: 1fr; }
            .story.lead .story-img { min-height: 0; aspect-ratio: 16 / 9; }
        }

        @media (max-width: 600px) {
            .wrap { padding: 0 16px; }
            .grid { grid-template-columns: 1fr; }
            .masthead { padding-top: 24px; }
            .story.lead .story-body { padding: 20px; }
            .controls { position: static; }
            .chyron { font-size: 1rem; }
        }

        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <header class="masthead">
        <div class="wrap">
            <div class="masthead-top">
                <h1>CNY News<small>Central New York stories from three local newsrooms</small></h1>
                <button class="refresh-btn" id="refreshBtn" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                    Refresh stories
                </button>
            </div>
            <div class="chyron" aria-live="polite">
                <span class="chyron-tag" id="chyronTag">Loading</span>
                <span class="chyron-text" id="chyronText">Gathering the latest local stories…</span>
            </div>
        </div>
    </header>

    <nav class="controls" aria-label="Story filters">
        <div class="wrap controls-inner">
            <div class="tabs" id="sourceTabs" role="group" aria-label="News source"></div>
            <div class="windows" role="group" aria-label="Time window">
                <span class="windows-label">Show</span>
                <button class="win active" data-hours="0" type="button">Everything</button>
                <button class="win" data-hours="24" type="button">Past 24 hrs</button>
                <button class="win" data-hours="48" type="button">Past 48 hrs</button>
            </div>
        </div>
    </nav>

    <main class="wrap">
        <p class="status" id="status"></p>
        <div class="notice" id="notice" hidden></div>
        <div class="grid" id="grid"></div>
    </main>

    <footer>Headlines link to the original newsroom. Betting promos and how-to-watch posts are filtered out.</footer>

    <script>
        // ============================================================
        // NEWS SOURCES: add or remove sources here.
        // "color" should match a --src-... variable at the top, or any hex code.
        // ============================================================
        const NEWS_SOURCES = [
            {
                id: 'syracuse',
                name: 'Syracuse.com',
                color: 'var(--src-syracuse)',
                feeds: ['https://www.syracuse.com/arc/outboundfeeds/rss/']
            },
            {
                id: 'localsyr',
                name: 'LocalSYR',
                color: 'var(--src-localsyr)',
                feeds: ['https://www.localsyr.com/feed/']
            },
            {
                id: 'cnycentral',
                name: 'CNY Central',
                color: 'var(--src-cnycentral)',
                feeds: ['https://cnycentral.com/news/local.rss']
            }
        ];

        // Stories matching any of these are treated as promotional, not news.
        const EXCLUDE_PATTERNS = [
            /how to watch/i, /where to watch/i, /what time/i, /what channel/i,
            /live stream/i, /watch live/i, /tv schedule/i, /streaming guide/i,
            /watch.*online/i, /best deals/i, /shopping/i, /sponsored/i,
            /advertisement/i, /bonus code/i, /promo code/i, /betmgm/i,
            /draftkings/i, /fanduel/i, /caesars/i, /betting/i, /sportsbook/i,
            /\bodds\b/i, /deposit bonus/i, /bet \$\d+/i, /\$\d+(\.\d+)?k?\s+bonus/i,
            /sign up bonus/i
        ];

        let allArticles = [];
        let activeSource = 'all';
        let activeHours = 0;
        let lastUpdated = null;

        const $ = (id) => document.getElementById(id);

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function stripHtml(html) {
            const tmp = document.createElement('div');
            tmp.innerHTML = html || '';
            return (tmp.textContent || '').replace(/\s+/g, ' ').trim();
        }

        function truncate(text, max) {
            if (text.length <= max) return text;
            return text.slice(0, text.lastIndexOf(' ', max)) + '…';
        }

        function isNewsContent(title, description) {
            const text = `${title} ${description}`;
            return !EXCLUDE_PATTERNS.some(p => p.test(text));
        }

        // ---------- Tabs ----------
        function buildTabs() {
            const tabs = $('sourceTabs');
            const all = [{ id: 'all', name: 'All sources', color: 'var(--ink)' }, ...NEWS_SOURCES];
            tabs.innerHTML = '';
            all.forEach(src => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tab' + (src.id === activeSource ? ' active' : '');
                btn.style.setProperty('--c', src.color);
                btn.dataset.source = src.id;
                btn.setAttribute('aria-pressed', src.id === activeSource);
                btn.innerHTML = `<span class="dot"></span>${escapeHtml(src.name)}<span class="count" data-count="${src.id}"></span>`;
                btn.addEventListener('click', () => {
                    activeSource = src.id;
                    document.querySelectorAll('.tab').forEach(t => {
                        const on = t.dataset.source === src.id;
                        t.classList.toggle('active', on);
                        t.setAttribute('aria-pressed', on);
                    });
                    render();
                });
                tabs.appendChild(btn);
            });
        }

        document.querySelectorAll('.win').forEach(btn => {
            btn.addEventListener('click', () => {
                activeHours = Number(btn.dataset.hours);
                document.querySelectorAll('.win').forEach(b => b.classList.toggle('active', b === btn));
                render();
            });
        });

        // ---------- Fetching ----------
        async function fetchFeed(feedUrl, source) {
            const proxies = [
                `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feedUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(feedUrl)}`,
                `https://corsproxy.io/?${encodeURIComponent(feedUrl)}`
            ];

            for (const proxyUrl of proxies) {
                try {
                    const response = await fetch(proxyUrl);
                    if (!response.ok) continue;

                    let items = [];
                    if (proxyUrl.includes('rss2json')) {
                        const data = await response.json();
                        if (data.status !== 'ok' || !data.items?.length) continue;
                        items = data.items.map(item => ({
                            title: item.title,
                            description: item.description || item.content || '',
                            link: item.link,
                            image: item.enclosure?.link || item.thumbnail || '',
                            date: new Date((item.pubDate || '').replace(' ', 'T') + (item.pubDate && !/Z|[+-]\d\d:?\d\d$/.test(item.pubDate) ? 'Z' : ''))
                        }));
                    } else {
                        const text = await response.text();
                        const xml = new DOMParser().parseFromString(text, 'text/xml');
                        const nodes = xml.querySelectorAll('item');
                        if (!nodes.length) continue;
                        items = Array.from(nodes).map(node => {
                            const get = (tag) => node.getElementsByTagName(tag)[0]?.textContent || '';
                            const media = node.getElementsByTagName('media:content')[0] || node.getElementsByTagName('media:thumbnail')[0];
                            return {
                                title: get('title'),
                                description: get('description') || get('content:encoded'),
                                link: get('link'),
                                image: node.querySelector('enclosure')?.getAttribute('url') || media?.getAttribute('url') || '',
                                date: new Date(get('pubDate') || Date.now())
                            };
                        });
                    }

                    return items
                        .filter(i => i.title && isNewsContent(i.title, i.description))
                        .slice(0, 15)
                        .map(i => ({
                            ...i,
                            date: isNaN(i.date) ? new Date() : i.date,
                            description: truncate(stripHtml(i.description), 220),
                            sourceId: source.id,
                            source: source.name,
                            color: source.color
                        }));
                } catch (err) {
                    console.warn(`Proxy failed for ${source.name}:`, err);
                }
            }
            console.warn(`All proxies failed for ${source.name}`);
            return [];
        }

        async function fetchNews() {
            const btn = $('refreshBtn');
            btn.disabled = true;
            btn.classList.add('spinning');
            $('chyronTag').textContent = 'Loading';
            $('chyronText').textContent = 'Gathering the latest local stories…';
            $('notice').hidden = true;
            if (!allArticles.length) showSkeletons();

            const jobs = NEWS_SOURCES.flatMap(src => src.feeds.map(url => fetchFeed(url, src)));
            const results = await Promise.allSettled(jobs);

            allArticles = results
                .filter(r => r.status === 'fulfilled')
                .flatMap(r => r.value)
                .sort((a, b) => b.date - a.date);

            lastUpdated = new Date();
            btn.disabled = false;
            btn.classList.remove('spinning');

            const failed = NEWS_SOURCES.filter(src => !allArticles.some(a => a.sourceId === src.id));
            if (failed.length === NEWS_SOURCES.length) {
                $('notice').innerHTML = '<strong>No stories loaded.</strong> The feed services may be busy. Wait a minute, then select Refresh stories.';
                $('notice').hidden = false;
            } else if (failed.length) {
                $('notice').innerHTML = `<strong>${failed.map(f => escapeHtml(f.name)).join(' and ')}</strong> didn't respond this time. Other sources are shown below; select Refresh stories to try again.`;
                $('notice').hidden = false;
            }

            render();
        }

        // ---------- Rendering ----------
        function showSkeletons() {
            $('grid').innerHTML = Array(6).fill('<div class="skeleton"></div>').join('');
            $('status').textContent = '';
        }

        function timeAgo(date) {
            const s = Math.floor((Date.now() - date) / 1000);
            if (s < 60) return 'Just now';
            const units = [['day', 86400], ['hr', 3600], ['min', 60]];
            for (const [unit, sec] of units) {
                const n = Math.floor(s / sec);
                if (n >= 1) return `${n} ${unit}${n > 1 ? 's' : ''} ago`;
            }
            return 'Just now';
        }

        function card(a, isLead) {
            const img = a.image
                ? `<img class="story-img" src="${escapeHtml(a.image)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;story-img fallback&quot;>${escapeHtml(a.source)}</div>'">`
                : `<div class="story-img fallback">${escapeHtml(a.source)}</div>`;
            return `
                <a class="story${isLead ? ' lead' : ''}" href="${escapeHtml(a.link)}" target="_blank" rel="noopener" style="--c:${a.color}">
                    ${img}
                    <div class="story-body">
                        <div class="story-meta">
                            <span class="story-source">${escapeHtml(a.source)}</span>
                            <span class="story-time">${timeAgo(a.date)}</span>
                        </div>
                        <h2 class="story-title">${escapeHtml(a.title)}</h2>
                        ${a.description ? `<p class="story-desc">${escapeHtml(a.description)}</p>` : ''}
                    </div>
                </a>`;
        }

        function render() {
            const cutoff = activeHours ? Date.now() - activeHours * 3600 * 1000 : 0;
            const inWindow = allArticles.filter(a => a.date >= cutoff);
            const shown = activeSource === 'all' ? inWindow : inWindow.filter(a => a.sourceId === activeSource);

            // Counts on tabs reflect the current time window
            document.querySelectorAll('[data-count]').forEach(el => {
                const id = el.dataset.count;
                el.textContent = id === 'all' ? inWindow.length : inWindow.filter(a => a.sourceId === id).length;
            });

            const time = lastUpdated ? lastUpdated.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
            $('chyronTag').textContent = `Updated ${time}`;
            $('chyronText').textContent = allArticles[0] ? `Latest: ${allArticles[0].title}` : 'No stories available right now';

            const where = activeSource === 'all' ? 'all sources' : NEWS_SOURCES.find(s => s.id === activeSource).name;
            const when = activeHours ? ` from the past ${activeHours} hours` : '';
            $('status').textContent = `${shown.length} ${shown.length === 1 ? 'story' : 'stories'} from ${where}${when}`;

            $('grid').innerHTML = shown.length
                ? shown.map((a, i) => card(a, i === 0)).join('')
                : `<div class="empty" style="grid-column:1/-1">No stories match these filters. Try a longer time window or another source.</div>`;
        }

        $('refreshBtn').addEventListener('click', fetchNews);
        buildTabs();
        fetchNews();
    </script>
</body>
</html>
